name: Build and Release

on:
  push:
    branches:
      - release

env:
  FLUTTER_VERSION: '3.38.9'

jobs:
  # Job 1: Build Web
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Remove old build artifacts from web folder
        run: |
          rm -f web/main.dart.js
          rm -f web/main.dart.js.map
          rm -f web/flutter_service_worker.js
          rm -f web/flutter_bootstrap.js
          rm -f web/version.json
          rm -rf web/assets
          rm -rf web/canvaskit
          rm -f web/.last_build_id

      - name: Clean all caches and previous builds
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build
          flutter pub cache repair

      - name: Get dependencies
        run: flutter pub get --no-precompile

      - name: Build Web
        run: flutter build web --release --base-href="/study_cards/" --no-tree-shake-icons

      - name: Upload Web Build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web

  # Job 2: Build Windows Desktop
  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Get dependencies
        run: flutter pub get

      - name: Build Windows
        run: flutter build windows --release

      - name: Create Windows Archive
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath study_cards_windows.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: study_cards_windows.zip

  # Job 3: Build Android APK
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: build/app/outputs/flutter-apk/app-release.apk

  # Job 4: Build iOS IPA with Codemagic
  build-ios:
    name: Build iOS IPA (Codemagic)
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Codemagic Build
        id: trigger_build
        run: |
          RESPONSE=$(curl -X POST \
            https://api.codemagic.io/builds \
            -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"appId\": \"${{ secrets.CODEMAGIC_APP_ID }}\",
              \"workflowId\": \"${{ secrets.CODEMAGIC_WORKFLOW_ID }}\",
              \"branch\": \"release\"
            }")
          echo "$RESPONSE"
          BUILD_ID=$(echo "$RESPONSE" | jq -r '.buildId')
          echo "BUILD_ID=$BUILD_ID" >> $GITHUB_OUTPUT
          echo "Codemagic Build ID: $BUILD_ID"

      - name: Wait for Codemagic Build
        run: |
          BUILD_ID="${{ steps.trigger_build.outputs.BUILD_ID }}"
          echo "Waiting for Codemagic build $BUILD_ID to complete..."
          MAX_ATTEMPTS=50
          ATTEMPT=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            RESPONSE=$(curl -s -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
              "https://api.codemagic.io/builds/$BUILD_ID")
            STATUS=$(echo "$RESPONSE" | jq -r '.build.status // .status // "null"')
            echo "Build status: $STATUS (Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS)"
            if [ "$STATUS" = "finished" ]; then
              echo "Build completed successfully!"
              break
            elif [ "$STATUS" = "failed" ] || [ "$STATUS" = "canceled" ]; then
              echo "Build failed or was canceled"
              exit 1
            elif [ "$STATUS" = "null" ]; then
              echo "Could not determine build status. Build might already be completed."
              # If status is null after several attempts, assume build is done
              if [ $ATTEMPT -gt 5 ]; then
                echo "Proceeding with download..."
                break
              fi
            fi
            ATTEMPT=$((ATTEMPT + 1))
            sleep 30
          done
          if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
            echo "Timeout waiting for build to complete"
            exit 1
          fi
      - name: Download iOS IPA from Codemagic
        run: |
          BUILD_ID="${{ steps.trigger_build.outputs.BUILD_ID }}"
          # Get artifact URL
          ARTIFACTS=$(curl -s -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" \
            "https://api.codemagic.io/builds/$BUILD_ID")
          ZIP_URL=$(echo "$ARTIFACTS" | jq -r '.build.artefacts[] | select(.name | endswith(".app.zip")) | .url')
          echo "Downloading Runner.app.zip from: $ZIP_URL"
          curl -L -H "x-auth-token: ${{ secrets.CODEMAGIC_API_TOKEN }}" -o Runner.app.zip "$ZIP_URL"
          
          # Extract Runner.app
          unzip Runner.app.zip
          
          # Create Payload folder and move Runner.app into it
          mkdir Payload
          mv Runner.app Payload/
          
          # Compress Payload folder and rename to .ipa
          zip -r study_cards.zip Payload
          mv study_cards.zip study_cards.ipa
      - name: Upload iOS Build
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: study_cards.ipa

  # Job 5: Create GitHub Release and Upload Assets
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-web, build-windows, build-android, build-ios]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: release
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Get version from pubspec.yaml
        id: get_version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}-${{ github.run_number }}
          name: Release v${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: false
          body: |
            ## Study Cards v${{ steps.get_version.outputs.VERSION }} is out! 🚀
            
            ### Downloads
            - 🌐 [Web App](https://${{ github.repository_owner }}.github.io/study_cards/)
            - 🪟 Windows Desktop
            - 🤖 Android APK
            - 🍎 iOS IPA
          files: |
            ./windows-build/study_cards_windows.zip
            ./android-build/app-release.apk
            ./ios-build/study_cards.ipa

  # Job 6: Deploy to GitHub Pages
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [create-release]
    permissions:
      contents: write
    steps:
      - name: Download Web Build
        uses: actions/download-artifact@v4
        with:
          name: web-build
          path: web-build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-build
          publish_branch: gh-pages
          force_orphan: true
